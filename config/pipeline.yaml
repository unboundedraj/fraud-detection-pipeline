# Central pipeline configuration. Every path is relative to the repo root.

source:
  # Public mirror of the Kaggle "Credit Card Fraud Detection" dataset (ULB, Sept 2013).
  url: https://storage.googleapis.com/download.tensorflow.org/data/creditcard.csv
  sha256: null            # pinned after first successful download (see data/landing/_manifest.json)
  # The raw `Time` column is "seconds since the first transaction". We anchor it to a
  # calendar timestamp so we can partition, window and replay events realistically.
  time_anchor: "2013-09-01T00:00:00"

paths:
  landing: data/landing
  bronze: data/bronze/transactions
  silver: data/silver/transactions
  gold: data/gold/features
  warehouse: data/warehouse.duckdb
  models: models
  reports: reports
  stream_root: data/stream

contracts:
  bronze: contracts/transactions_bronze.yaml
  silver: contracts/transactions_silver.yaml
  gold: contracts/features_gold.yaml

features:
  velocity_window_seconds: 60
  amount_window_seconds: 3600

training:
  # Chronological split - the model is always evaluated on transactions that happen
  # *after* everything it was trained on (no look-ahead leakage).
  train_fraction: 0.70
  validation_fraction: 0.15
  random_seed: 42
  # Business cost model used to pick the alerting threshold.
  cost_false_positive: 5.0     # analyst review cost per alert (USD)
  cost_false_negative_floor: 25.0  # min loss per missed fraud; actual loss = max(floor, amount)

registry:
  primary_metric: pr_auc
  min_improvement: 0.0         # challenger must beat champion by at least this much

stream:
  topic_transactions: transactions.raw
  topic_alerts: fraud.alerts
  micro_batch_size: 500
  bootstrap_servers: localhost:19092

monitoring:
  psi_warn: 0.10
  psi_alert: 0.25
